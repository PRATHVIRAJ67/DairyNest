# Render Blueprint (render.com > New > Blueprint > pick this repo).
services:
  # Public DEMO API: in-memory data, any phone number + code 123456, simulated payments.
  # Free instances sleep after ~15 idle minutes; the next request wakes them (about 1 minute) and data resets.
  - type: web
    name: dailydairy-demo-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: START_MODE
        value: demo
      - key: PUBLIC_DEMO
        value: "1"

